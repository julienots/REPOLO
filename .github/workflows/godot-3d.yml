# Version 3D (Godot) : import, tests automatiques, captures d'écran, export de l'APK Android
# et publication dans la release « apk-3d-latest ».
name: Godot 3D

on:
  push:
    branches: [main, master, ccr-fb0844a4-g9ok83]
    paths:
      - 'godot/**'
      - 'shared/**'
      - 'scripts/export-godot-data.mjs'
      - '.github/workflows/godot-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Données du jeu (depuis shared/data)
        run: node scripts/export-godot-data.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installation de Godot (officiel) et des modèles d'export
        run: |
          set -e
          V=${GODOT_VERSION}
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable" /tmp/tpl
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          godot --version

      - name: Import du projet (échoue si un script contient une erreur)
        run: |
          godot --headless --path godot --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" import.log; then echo "::error::Erreurs GDScript"; exit 1; fi

      - name: Tests (parité avec la version web + simulation)
        run: |
          godot --headless --path godot res://tests/test_runner.tscn 2>&1 | tee tests.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" tests.log; then echo "::error::Erreurs à l'exécution des tests"; exit 1; fi
          grep -q "réussis, 0 échoués" tests.log

      - name: Captures d'écran (rendu logiciel)
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb mesa-utils >/dev/null
          if [ -f godot/tools/screenshots.tscn ]; then
            mkdir -p shots
            timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" godot --path godot --rendering-driver opengl3 res://tools/screenshots.tscn -- --out="$PWD/shots" > shots.log 2>&1 || true
            tail -60 shots.log
            echo "---- erreurs du rendu ----"
            grep -E "SCRIPT ERROR|SHADER ERROR|ERROR|error\(" shots.log | sort | uniq -c | sort -rn | head -40 || true
            ls -la shots
          fi

      - name: Publication des captures (branche ci-shots)
        if: always()
        continue-on-error: true
        run: |
          [ -d shots ] && [ "$(ls shots)" ] || exit 0
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-shots || true
          TMP=$(mktemp -d); cp shots/* "$TMP"/
          git checkout --orphan ci-shots-new
          git rm -rq --cached . ; git clean -fdq -e shots
          cp "$TMP"/* . && git add *.png && git commit -qm "Captures ${GITHUB_SHA}" && git push -f origin ci-shots-new:ci-shots
          git checkout -q "${GITHUB_SHA}"

      - name: Préparation de la signature Android (clé de débogage)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          cat "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"

      - name: Export de l'APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
          godot --headless --path godot --export-debug "Android" "$PWD/build/OperationPanique3D.apk" 2>&1 | tee export.log | tail -30
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" export.log; then echo "::error::Erreurs GDScript à l'export"; exit 1; fi
          ls -la build
          test -s build/OperationPanique3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-3d
          path: build/OperationPanique3D.apk

      - name: Publication (Release « apk-3d-latest »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="OperationPanique3D-v0.2.${GITHUB_RUN_NUMBER}.apk"
          cp build/OperationPanique3D.apk "$F"
          gh release delete apk-3d-latest --yes --cleanup-tag || true
          gh release create apk-3d-latest "$F" --prerelease --target "${GITHUB_SHA}" \
            --title "Opération Panique 3D (Godot) — APK Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Version 3D en développement (Godot ${GODOT_VERSION}). APK de test signée avec une clé de débogage. Commit ${GITHUB_SHA}."
